<igx-select #select [(ngModel)]="locale">
    <igx-prefix>Location:</igx-prefix>

    @for (locale of locales; track locale) {
        <igx-select-item [value]="locale">
            {{ locale }}
        </igx-select-item>
    }
</igx-select>

<igx-calendar
    #calendar
    [locale]="locale"
    [weekStart]="1"
    [formatOptions]="formatOptions"
    [formatViews]="formatViews"
>
</igx-calendar>
