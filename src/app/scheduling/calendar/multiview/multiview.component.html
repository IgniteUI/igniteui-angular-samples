<div class="multiview-sample">
    <div class="stay-info">
        <div class="stay-info__text">
            @if (range.length <= 1) {
                <span>{{ action }}</span>
            }
            @if (range.length > 1) {
                <span><strong>{{ checkin }}</strong> - <strong>{{ checkout }}</strong> ({{ this.range.length - 1 }} nights stay)</span>
            }
        </div>

        <button igxButton="contained"
                [class.is-incomplete]="!isRangeSelected"
                [attr.aria-describedby]="isRangeSelected ? null : 'check-availability-hint'"
                (click)="submitDates()">Check Availability</button>
        <span id="check-availability-hint" class="visually-hidden">
            Select a check-in and a check-out date on the calendar to enable this button.
        </span>
    </div>

    <igx-calendar #calendar selection="range" [monthsViewNumber]="2" [hideOutsideDays]="true"
                  (selected)="selectDates($event)">
    </igx-calendar>
</div>

<igx-dialog #alert title="Availability" leftButtonLabel="OK" (leftButtonSelect)="alert.close()">
</igx-dialog>
