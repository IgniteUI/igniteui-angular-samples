<div class="badge-outlined">
  <div class="outlined-example">
    <div class="icon-circle">
      <igx-icon>favorite_border</igx-icon>
    </div>
    <igx-badge value="23" type="info" outlined></igx-badge>
  </div>
  <div class="outlined-example">
    <igx-avatar initials="AZ" shape="rounded" size="small"></igx-avatar>
    <igx-badge icon="close" type="error" outlined></igx-badge>
  </div>
  <div class="steps">
    @for (step of steps; track step.label) {
      @if (!$first) {
        <span class="step-connector" [class.pending]="step.pending"></span>
      }
      <div class="step">
        <div class="step-marker">
          <span class="step-circle" [class.pending]="step.pending">{{ step.index }}</span>
          @if (step.current) {
            <igx-badge dot type="info" outlined></igx-badge>
          }
        </div>
        <span class="step-label">{{ step.label }}</span>
      </div>
    }
  </div>
</div>
