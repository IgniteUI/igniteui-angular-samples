<div class="sizes">
    @for (size of sizes; track size.label) {
        <div class="size">
            <span class="state-label">{{ size.label }}</span>
            <!-- The input field is hidden, so the dropdown opens at the element around the combo,
                 and a click elsewhere does not close it. -->
            <div #dropdown class="dropdown {{ size.className }}">
                <igx-combo
                    #combo
                    [resourceStrings]="{ igx_combo_filter_search_placeholder: 'Search' }"
                    valueKey="id"
                    displayKey="name"
                    groupKey="group"
                    [data]="options"
                    [overlaySettings]="{ target: dropdown, closeOnOutsideClick: false }"
                    (closing)="keepOpen($event)">
                </igx-combo>
            </div>
            <div class="selection">
                <span class="selection-title">Selection</span>
                @for (option of combo.selection; track option.id) {
                    <span>{{ option.name }}</span>
                } @empty {
                    <span>No items selected</span>
                }
            </div>
        </div>
    }
</div>
