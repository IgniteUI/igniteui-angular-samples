<div class="types">
    @for (type of types; track type.label) {
        <div class="type {{ type.type }}-type">
            <span class="type-label">{{ type.label }}</span>
            <igx-combo
                #combo
                [type]="type.type"
                placeholder="Select a value"
                searchPlaceholder="Search"
                valueKey="id"
                displayKey="name"
                groupKey="group"
                [data]="options"
                [overlaySettings]="{ closeOnOutsideClick: false }">
                <label igxLabel>Label</label>
                <igx-prefix>
                    <igx-icon family="material" name="language"></igx-icon>
                </igx-prefix>
            </igx-combo>
            <div class="selection">
                <span class="selection-title">Selection</span>
                @for (option of combo.selection; track option.id) {
                    <span>{{ option.name }}</span>
                } @empty {
                    <span class="selection-empty">No items selected</span>
                }
            </div>
        </div>
    }
</div>
