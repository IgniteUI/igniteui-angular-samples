<div class="combo-column">
    <igx-combo
        type="border"
        [data]="people"
        valueKey="name"
        displayKey="name"
        groupKey="department"
        searchPlaceholder="Search people…"
        [(ngModel)]="selectedPeople"
        [overlaySettings]="overlaySettings">
        <label igxLabel>Team members</label>
    </igx-combo>
</div>
