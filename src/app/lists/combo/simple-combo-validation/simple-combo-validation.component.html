<div class="states">
    <span class="type-label"></span>
    @for (state of states; track state.label) {
        <span class="state-label state-column">{{ state.label }}</span>
    }
    @for (type of types; track type.label) {
        <span class="state-label type-label {{ type.type }}-type">{{ type.label }}</span>
        @for (state of states; track state.label) {
            <igx-simple-combo
                class="state-combo {{ state.className }} {{ type.type }}-type"
                [type]="type.type"
                placeholder="Country"
                valueKey="id"
                displayKey="name"
                [data]="countries">
                @if (state.helperText) {
                    <igx-hint>{{ state.helperText }}</igx-hint>
                }
            </igx-simple-combo>
        }
    }
</div>
