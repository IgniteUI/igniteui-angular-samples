<igx-combo
    class="locations"
    type="border"
    placeholder="Cities"
    searchPlaceholder="Search cities"
    valueKey="id"
    displayKey="name"
    groupKey="country"
    [data]="cities">
    <label igxLabel>Locations</label>
    <igx-prefix>
        <igx-icon family="material" name="place"></igx-icon>
    </igx-prefix>
</igx-combo>
