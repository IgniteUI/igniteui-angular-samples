<div class="states">
    <span></span>
    @for (state of states; track state.label) {
        <span class="state-label state-column">{{ state.label }}</span>
    }
    @for (type of types; track type.label) {
        <span class="state-label type-label">{{ type.label }}</span>
        @for (state of states; track state.label) {
            <igx-combo
                class="state-combo {{ state.className }}"
                [type]="type.type"
                placeholder="Country"
                searchPlaceholder="Search"
                valueKey="id"
                displayKey="name"
                groupKey="region"
                [data]="countries">
                @if (state.helperText) {
                    <igx-hint>{{ state.helperText }}</igx-hint>
                }
            </igx-combo>
        }
    }
</div>
