<div class="combo-features">
    <div class="combo-column">
        <igx-combo type="border" [data]="lData" displayKey="field" valueKey="field"
            searchPlaceholder="Search…" [allowCustomValues]="customValues"
            [disableFiltering]="disableFiltering" [showSearchCaseIcon]="showSearchCaseIcon"
            [groupKey]="grouping ? 'region' : ''" [disabled]="disabled">
            <label igxLabel>Location</label>
        </igx-combo>
    </div>

    <div class="controls">
        <igx-switch [(ngModel)]="disableFiltering">Disable Filtering</igx-switch>
        <igx-switch [disabled]="disableFiltering" [(ngModel)]="showSearchCaseIcon">Show Case-sensitive Icon</igx-switch>
        <igx-switch [(ngModel)]="customValues">Allow Custom Values</igx-switch>
        <igx-switch [(ngModel)]="grouping">Enable Grouping</igx-switch>
        <igx-switch [(ngModel)]="disabled">Disable Combo</igx-switch>
    </div>
</div>
