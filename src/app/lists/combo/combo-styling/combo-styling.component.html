<div>
    <igx-combo
        #combo
        class="styled-combo"
        type="border"
        placeholder="Country"
        [resourceStrings]="{ igx_combo_filter_search_placeholder: 'Search' }"
        valueKey="id"
        displayKey="name"
        groupKey="region"
        [data]="countries"
        [(ngModel)]="selection">
    </igx-combo>
    <div class="selection">
        <span class="selection-title">Selection</span>
        @for (country of combo.selection; track country.id) {
            <span>{{ country.name }}</span>
        } @empty {
            <span>No items selected</span>
        }
    </div>
</div>
